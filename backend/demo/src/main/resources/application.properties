spring.application.name=incident-management
server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# 256-bit secret key in base64/hex
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Access token expiration: 1 hour (3600000 ms)
app.jwt.expiration-ms=3600000
# Refresh token expiration: 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
